[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "como-ocsr"
version = "1.2.4"
description = "COMO: Closed-loop Optical Molecule recOgnition with Minimum Risk Training"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Zhuoqi Lyu" },
]
keywords = [
    "cheminformatics",
    "optical-chemical-structure-recognition",
    "ocsr",
    "molecule-recognition",
    "deep-learning",
    "transformer",
    "rdkit",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "rdkit",
    "SmilesPE>=0.0.3",
    "albumentations>=1.3",
    "opencv-python-headless>=4.5",
    "Pillow>=9.0",
    "numpy>=1.21",
    "pandas>=1.5",
    "tqdm>=4.60",
]

[project.urls]
Homepage = "https://huggingface.co/Keylab/COMO"
Repository = "https://github.com/netknowledge/COMO"
"Bug Tracker" = "https://github.com/netknowledge/COMO/issues"

[tool.setuptools]
packages = ["como"]
